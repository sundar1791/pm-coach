name: Daily AGI Briefing

on:
  schedule:
    # Runs every day at 07:00 UTC (adjust to taste)
    - cron: '0 7 * * *'
  # Allow manual runs from the Actions tab
  workflow_dispatch:

permissions:
  contents: write   # needed to push the saved briefing file

jobs:
  generate-and-send:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout daily-ai-updates branch
        uses: actions/checkout@v4
        with:
          ref: daily-ai-updates
          # GITHUB_TOKEN is injected automatically; 'contents: write' above
          # gives it push access.

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install script dependencies
        # Installs only what the script needs without touching package.json
        run: npm install --no-save @anthropic-ai/sdk

      - name: Generate briefing, commit, and send email
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESEND_API_KEY:    ${{ secrets.RESEND_API_KEY }}
        run: node scripts/generate-briefing.mjs
